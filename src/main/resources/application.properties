spring.application.name=hotelya-back
server.port=${SERVER_PORT:8080}
spring.datasource.url=${HOTELYA_DB_URL}
spring.datasource.username=${HOTELYA_DB_USER}
spring.datasource.password=${HOTELYA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.flyway.default-schema=${HOTELYA_DB_SCHEMA:hotelya}
spring.flyway.schemas=${HOTELYA_DB_SCHEMA:hotelya}
spring.flyway.create-schemas=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${HOTELYA_DB_SCHEMA:hotelya}
spring.jpa.open-in-view=false
catalog.cors.allowed-origins=${HOTELYA_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
catalog.seed.enabled=false
spring.flyway.placeholders.catalogSchema=${HOTELYA_DB_SCHEMA:hotelya}

owner.jwt.secret=${HOTELYA_JWT_SECRET}
owner.cookie.secure=${HOTELYA_COOKIE_SECURE:false}
owner.bootstrap.email=${HOTELYA_LUMIS_OWNER_EMAIL:}
owner.bootstrap.password=${HOTELYA_LUMIS_OWNER_PASSWORD:}
